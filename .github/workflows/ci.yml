name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gates:
    name: gates (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os:
          - windows-latest
          - macos-latest
          - ubuntu-latest
    steps:
      - name: Check out the tree
        uses: actions/checkout@v7

      - name: Check the FFmpeg fetch script
        if: runner.os == 'Windows'
        shell: powershell
        run: |
          $errors = $null
          [System.Management.Automation.Language.Parser]::ParseFile(
            (Join-Path $PWD 'scripts\fetch-ffmpeg.ps1'), [ref]$null, [ref]$errors
          ) > $null
          if ($errors.Count -gt 0) {
            $errors | ForEach-Object { Write-Error $_.Message }
            exit 1
          }

      - name: Install the stable toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Cache cargo artifacts
        uses: Swatinem/rust-cache@v2

      - name: Check formatting
        run: cargo fmt --all --check

      - name: Lint every target (pedantic, warnings denied)
        run: cargo clippy --all-targets --locked -- -D warnings

      - name: Run the test suite
        run: cargo test --all-targets --locked

      # Unit tests never start the program. This does: a runner has no
      # desktop session and no bundled engine, so the point is not that
      # `--check` passes but that the release binary (the profile with LTO,
      # stripped symbols, and no debug assertions) loads its platform
      # libraries, prints the report, and exits with a status instead of
      # panicking or hanging. A panic surfaces as 101 here.
      - name: Start the release binary and read its report (non-Windows)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          set -o pipefail
          cargo build --release --locked
          set +e
          report=$(./target/release/screencapture --check 2>&1)
          status=$?
          set -e
          printf '%s\n' "$report"
          if [ "$status" -ne 0 ] && [ "$status" -ne 1 ]; then
              echo "--check exited $status; a refusal is 1 and a panic is 101"
              exit 1
          fi
          for needle in 'settings file:' 'capture:' 'result:'; do
              case "$report" in
                  *"$needle"*) ;;
                  *) echo "--check never printed [$needle]"; exit 1 ;;
              esac
          done
          case "$report" in
              *panic*) echo '--check panicked'; exit 1 ;;
          esac
          echo "report ok (exit $status)"

  installer:
    name: installer (windows)
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - name: Check out the tree
        uses: actions/checkout@v7

      - name: Install the stable toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo artifacts
        uses: Swatinem/rust-cache@v2

      - name: Install NSIS 3.13
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          choco install nsis --version=3.13.0 --no-progress -y --force
          if ($LASTEXITCODE -ne 0) { throw 'chocolatey could not install NSIS 3.13.0' }
          $makensis = Join-Path ${env:ProgramFiles(x86)} 'NSIS\makensis.exe'
          if (-not (Test-Path -LiteralPath $makensis)) { throw "makensis not found at $makensis" }
          & $makensis /VERSION
          if ($LASTEXITCODE -ne 0) { throw 'makensis refused to run' }

      - name: Fetch the pinned FFmpeg engine
        shell: powershell
        run: ./scripts/fetch-ffmpeg.ps1

      - name: Record the engine integrity
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $engine = 'vendor/ffmpeg/ffmpeg.exe'
          if (-not (Test-Path -LiteralPath $engine)) { throw 'the fetched engine is missing' }
          $hash = (Get-FileHash -LiteralPath $engine -Algorithm SHA256).Hash.ToLowerInvariant()
          Set-Content -LiteralPath 'vendor/ffmpeg/engine.sha256' -Value $hash
          Write-Host "engine sha256: $hash"

      - name: Build the release executable
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          cargo build --release --locked
          if ($LASTEXITCODE -ne 0) { throw 'cargo build --release failed' }

      # The unit tests never open a pipe to the engine, so this is the only
      # check that the capture worker, the encoder arguments, and the file
      # they produce still line up. The take is short and writes to the
      # runner's temp folder; a session that refuses capture fails here
      # rather than shipping a build nobody ever recorded with.
      - name: Smoke the capture pipeline
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $app = Join-Path $PWD 'target\release\screencapture.exe'
          $ffprobe = Join-Path $PWD 'vendor\ffmpeg\ffprobe.exe'
          $engine = Join-Path $PWD 'vendor\ffmpeg\ffmpeg.exe'
          $root = Join-Path $env:RUNNER_TEMP 'smoke'
          $videos = Join-Path $root 'videos'
          $images = Join-Path $root 'images'
          $settings = Join-Path $root 'settings.cfg'
          if (Test-Path -LiteralPath $root) { Remove-Item -LiteralPath $root -Recurse -Force }
          New-Item -ItemType Directory -Force -Path $videos, $images | Out-Null
          # No here-string here: YAML indents every line, and a here-string's
          # end mark has to start at column zero.
          $lines = @(
              '[hotkeys]'
              'record = ctrl+shift+x'
              'photo = ctrl+shift+z'
              'chimes = ctrl+shift+m'
              ''
              '[capture]'
              'mode = full'
              'chimes = false'
              ''
              '[recording]'
              'profile = hd-720p30'
              'codec = x264'
              'cursor = false'
              'mic = false'
              'system_audio = false'
              'audio_quality = speech'
              ''
              '[media]'
              "videos = `"$videos`""
              "images = `"$images`""
              ''
              '[engine]'
              "path = `"$engine`""
          )
          $lines | Set-Content -LiteralPath $settings -Encoding ascii

          & $app --check --config $settings
          if ($LASTEXITCODE -ne 0) { throw '--check failed' }

          & $app --record 2 --config $settings --rect 0,0,640,360
          if ($LASTEXITCODE -ne 0) { throw '--record failed' }
          $video = Get-ChildItem -LiteralPath $videos -Filter *.mp4 |
              Sort-Object LastWriteTime | Select-Object -Last 1
          if ($null -eq $video) { throw 'no recording was written' }
          $probe = & $ffprobe -v error -show_entries format=duration `
              -show_entries stream=codec_name -of default=noprint_wrappers=1 $video.FullName
          $codecs = @($probe | Where-Object { $_ -like 'codec_name=*' } |
              ForEach-Object { $_.Split('=')[1] })
          $duration = [double](@($probe | Where-Object { $_ -like 'duration=*' })[0].Split('=')[1])
          Write-Host "recording: $($video.Name), $([math]::Round($video.Length / 1kb)) KiB, $duration s, codecs $($codecs -join ',')"
          if ($codecs -notcontains 'h264') { throw 'the recording has no H.264 video stream' }
          if ($codecs -notcontains 'aac') { throw 'the recording has no AAC audio stream' }
          if ($duration -lt 1.5 -or $duration -gt 4) { throw "the recording is $duration s long" }

          & $app --photo --config $settings --rect 0,0,320,200
          if ($LASTEXITCODE -ne 0) { throw '--photo failed' }
          $still = Get-ChildItem -LiteralPath $images -Filter *.png |
              Sort-Object LastWriteTime | Select-Object -Last 1
          if ($null -eq $still) { throw 'no still was written' }
          $bytes = [System.IO.File]::ReadAllBytes($still.FullName)
          Write-Host "still: $($still.Name), $($bytes.Length) bytes"
          if ($bytes.Length -lt 1000) { throw "the still is only $($bytes.Length) bytes" }
          if (-not ($bytes[0] -eq 0x89 -and $bytes[1] -eq 0x50 -and $bytes[2] -eq 0x4E -and $bytes[3] -eq 0x47)) {
              throw 'the still is not a PNG'
          }
          Write-Host 'capture smoke ok'
          Remove-Item -LiteralPath $root -Recurse -Force

      - name: Compile the installer
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $makensis = Join-Path ${env:ProgramFiles(x86)} 'NSIS\makensis.exe'
          & $makensis "/DROOT=$($PWD.Path)" installer/nsis/screencapture.nsi
          if ($LASTEXITCODE -ne 0) { throw 'installer/nsis/screencapture.nsi does not compile' }
          $setup = Get-Item -LiteralPath installer/screencapture-setup.exe
          $version = (Select-String -LiteralPath Cargo.toml -Pattern '^version = "(.+)"$').Matches[0].Groups[1].Value
          if ($setup.VersionInfo.ProductVersion -ne $version) {
              throw "installer product version [$($setup.VersionInfo.ProductVersion)] does not match $version"
          }
          Write-Host "built $($setup.Name): $($setup.Length) bytes, version $version"

      - name: Install and uninstall without elevation
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $setup = Join-Path $PWD 'installer/screencapture-setup.exe'
          if (-not (Select-String -LiteralPath $setup -Pattern 'requestedExecutionLevel level="asInvoker"' -SimpleMatch -Quiet)) {
              throw 'the setup does not request asInvoker; it would prompt for administrator rights'
          }
          $version = (Select-String -LiteralPath Cargo.toml -Pattern '^version = "(.+)"$').Matches[0].Groups[1].Value
          # A per-user install lives outside Program Files and asks for no
          # elevation, so the whole round trip has to work as this account.
          $install = Join-Path $env:RUNNER_TEMP 'screencapture-install'
          if ($install -match '\s') { throw "the temporary install path must not contain spaces: $install" }
          if (Test-Path -LiteralPath $install) { Remove-Item -LiteralPath $install -Recurse -Force }
          $process = Start-Process -FilePath $setup -ArgumentList '/S', "/D=$install" -Wait -PassThru
          if ($process.ExitCode -ne 0) { throw "the silent install exited $($process.ExitCode)" }
          foreach ($file in @('screencapture.exe', 'uninstall.exe', 'ffmpeg/ffmpeg.exe', 'ffmpeg/engine.sha256', 'docs/FFMPEG-LICENSE.md')) {
              $path = Join-Path $install $file
              if (-not (Test-Path -LiteralPath $path)) { throw "the install is missing $file" }
          }
          $installed = (Get-Item -LiteralPath (Join-Path $install 'screencapture.exe')).VersionInfo
          if ($installed.ProductVersion -ne $version) { throw "the installed exe is version [$($installed.ProductVersion)], expected $version" }
          $entry = 'HKCU:\Software\Microsoft\Windows\CurrentVersion\Uninstall\Screencapture'
          $registered = Get-ItemProperty -LiteralPath $entry -ErrorAction SilentlyContinue
          if ($null -eq $registered) { throw 'the install wrote no per-user uninstall entry' }
          if ($registered.DisplayVersion -ne $version) { throw "the uninstall entry records [$($registered.DisplayVersion)], expected $version" }
          if (Test-Path 'HKLM:\Software\Microsoft\Windows\CurrentVersion\Uninstall\Screencapture') {
              throw 'the setup wrote an all-users uninstall entry; it must stay per-user'
          }
          $shortcuts = Join-Path $env:APPDATA 'Microsoft\Windows\Start Menu\Programs\Screencapture'
          if (-not (Test-Path -LiteralPath (Join-Path $shortcuts 'Screencapture.lnk'))) { throw 'the install wrote no Start Menu shortcut' }
          $uninstaller = Start-Process -FilePath (Join-Path $install 'uninstall.exe') -ArgumentList '/S' -Wait -PassThru
          if ($uninstaller.ExitCode -ne 0) { throw "the silent uninstall exited $($uninstaller.ExitCode)" }
          # The silent uninstaller finishes its deletes on a detached process,
          # so poll briefly instead of assuming it is done when the start returns.
          $deadline = (Get-Date).AddSeconds(60)
          while ((Test-Path -LiteralPath $install) -and ((Get-Date) -lt $deadline)) { Start-Sleep -Milliseconds 500 }
          if (Test-Path -LiteralPath $install) { throw 'the uninstall left the install directory behind' }
          if (Test-Path -LiteralPath $entry) { throw 'the uninstall left the registry entry behind' }
          if (Test-Path -LiteralPath $shortcuts) { throw 'the uninstall left the Start Menu folder behind' }
          Remove-Item -LiteralPath 'HKCU:\Software\Screencapture' -Recurse -Force -ErrorAction SilentlyContinue
          Write-Host "per-user install and uninstall round trip ok at $install (version $version)"
