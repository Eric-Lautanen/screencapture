name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gates:
    name: gates (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os:
          - windows-latest
          - macos-latest
          - ubuntu-latest
    steps:
      - name: Check out the tree
        uses: actions/checkout@v7

      - name: Check the FFmpeg fetch script
        if: runner.os == 'Windows'
        shell: powershell
        run: |
          $errors = $null
          [System.Management.Automation.Language.Parser]::ParseFile(
            (Join-Path $PWD 'scripts\fetch-ffmpeg.ps1'), [ref]$null, [ref]$errors
          ) > $null
          if ($errors.Count -gt 0) {
            $errors | ForEach-Object { Write-Error $_.Message }
            exit 1
          }

      - name: Install the stable toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Cache cargo artifacts
        uses: Swatinem/rust-cache@v2

      - name: Check formatting
        run: cargo fmt --all --check

      - name: Lint every target (pedantic, warnings denied)
        run: cargo clippy --all-targets --locked -- -D warnings

      - name: Run the test suite
        run: cargo test --all-targets --locked

  installer:
    name: installer (windows)
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - name: Check out the tree
        uses: actions/checkout@v7

      - name: Install the stable toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo artifacts
        uses: Swatinem/rust-cache@v2

      - name: Install NSIS 3.13
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          choco install nsis --version=3.13.0 --no-progress -y --force
          if ($LASTEXITCODE -ne 0) { throw 'chocolatey could not install NSIS 3.13.0' }
          $makensis = Join-Path ${env:ProgramFiles(x86)} 'NSIS\makensis.exe'
          if (-not (Test-Path -LiteralPath $makensis)) { throw "makensis not found at $makensis" }
          & $makensis /VERSION
          if ($LASTEXITCODE -ne 0) { throw 'makensis refused to run' }

      - name: Fetch the pinned FFmpeg engine
        shell: powershell
        run: ./scripts/fetch-ffmpeg.ps1

      - name: Record the engine integrity
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $engine = 'vendor/ffmpeg/ffmpeg.exe'
          if (-not (Test-Path -LiteralPath $engine)) { throw 'the fetched engine is missing' }
          $hash = (Get-FileHash -LiteralPath $engine -Algorithm SHA256).Hash.ToLowerInvariant()
          Set-Content -LiteralPath 'vendor/ffmpeg/engine.sha256' -Value $hash
          Write-Host "engine sha256: $hash"

      - name: Build the release executable
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          cargo build --release --locked
          if ($LASTEXITCODE -ne 0) { throw 'cargo build --release failed' }

      - name: Compile the installer
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $makensis = Join-Path ${env:ProgramFiles(x86)} 'NSIS\makensis.exe'
          & $makensis "/DROOT=$($PWD.Path)" installer/nsis/screencapture.nsi
          if ($LASTEXITCODE -ne 0) { throw 'installer/nsis/screencapture.nsi does not compile' }
          $setup = Get-Item -LiteralPath installer/screencapture-setup.exe
          $version = (Select-String -LiteralPath Cargo.toml -Pattern '^version = "(.+)"$').Matches[0].Groups[1].Value
          if ($setup.VersionInfo.ProductVersion -ne $version) {
              throw "installer product version [$($setup.VersionInfo.ProductVersion)] does not match $version"
          }
          Write-Host "built $($setup.Name): $($setup.Length) bytes, version $version"

      - name: Install and uninstall without elevation
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $setup = Join-Path $PWD 'installer/screencapture-setup.exe'
          if (-not (Select-String -LiteralPath $setup -Pattern 'requestedExecutionLevel level="asInvoker"' -SimpleMatch -Quiet)) {
              throw 'the setup does not request asInvoker; it would prompt for administrator rights'
          }
          $version = (Select-String -LiteralPath Cargo.toml -Pattern '^version = "(.+)"$').Matches[0].Groups[1].Value
          # A per-user install lives outside Program Files and asks for no
          # elevation, so the whole round trip has to work as this account.
          $install = Join-Path $env:RUNNER_TEMP 'screencapture-install'
          if ($install -match '\s') { throw "the temporary install path must not contain spaces: $install" }
          if (Test-Path -LiteralPath $install) { Remove-Item -LiteralPath $install -Recurse -Force }
          $process = Start-Process -FilePath $setup -ArgumentList '/S', "/D=$install" -Wait -PassThru
          if ($process.ExitCode -ne 0) { throw "the silent install exited $($process.ExitCode)" }
          foreach ($file in @('screencapture.exe', 'uninstall.exe', 'ffmpeg/ffmpeg.exe', 'ffmpeg/engine.sha256', 'docs/FFMPEG-LICENSE.md')) {
              $path = Join-Path $install $file
              if (-not (Test-Path -LiteralPath $path)) { throw "the install is missing $file" }
          }
          $installed = (Get-Item -LiteralPath (Join-Path $install 'screencapture.exe')).VersionInfo
          if ($installed.ProductVersion -ne $version) { throw "the installed exe is version [$($installed.ProductVersion)], expected $version" }
          $entry = 'HKCU:\Software\Microsoft\Windows\CurrentVersion\Uninstall\Screencapture'
          $registered = Get-ItemProperty -LiteralPath $entry -ErrorAction SilentlyContinue
          if ($null -eq $registered) { throw 'the install wrote no per-user uninstall entry' }
          if ($registered.DisplayVersion -ne $version) { throw "the uninstall entry records [$($registered.DisplayVersion)], expected $version" }
          if (Test-Path 'HKLM:\Software\Microsoft\Windows\CurrentVersion\Uninstall\Screencapture') {
              throw 'the setup wrote an all-users uninstall entry; it must stay per-user'
          }
          $shortcuts = Join-Path $env:APPDATA 'Microsoft\Windows\Start Menu\Programs\Screencapture'
          if (-not (Test-Path -LiteralPath (Join-Path $shortcuts 'Screencapture.lnk'))) { throw 'the install wrote no Start Menu shortcut' }
          $uninstaller = Start-Process -FilePath (Join-Path $install 'uninstall.exe') -ArgumentList '/S' -Wait -PassThru
          if ($uninstaller.ExitCode -ne 0) { throw "the silent uninstall exited $($uninstaller.ExitCode)" }
          # The silent uninstaller finishes its deletes on a detached process,
          # so poll briefly instead of assuming it is done when the start returns.
          $deadline = (Get-Date).AddSeconds(60)
          while ((Test-Path -LiteralPath $install) -and ((Get-Date) -lt $deadline)) { Start-Sleep -Milliseconds 500 }
          if (Test-Path -LiteralPath $install) { throw 'the uninstall left the install directory behind' }
          if (Test-Path -LiteralPath $entry) { throw 'the uninstall left the registry entry behind' }
          if (Test-Path -LiteralPath $shortcuts) { throw 'the uninstall left the Start Menu folder behind' }
          Remove-Item -LiteralPath 'HKCU:\Software\Screencapture' -Recurse -Force -ErrorAction SilentlyContinue
          Write-Host "per-user install and uninstall round trip ok at $install (version $version)"
