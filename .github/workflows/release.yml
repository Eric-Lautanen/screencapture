name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: build and publish
    runs-on: windows-latest
    timeout-minutes: 120
    steps:
      - name: Check out the tagged tree
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Require a version tag on main
        id: version
        shell: pwsh
        env:
          TAG: ${{ github.ref_name }}
        run: |
          $ErrorActionPreference = 'Stop'
          $version = (Select-String -LiteralPath Cargo.toml -Pattern '^version = "(.+)"$').Matches[0].Groups[1].Value
          if ([string]::IsNullOrWhiteSpace($version)) { throw 'Cargo.toml has no package version' }
          if ($env:TAG -ne "v$version") {
              throw "tag $env:TAG does not match Cargo.toml version $version"
          }
          $head = (git rev-parse HEAD).Trim()
          if ($LASTEXITCODE -ne 0) { throw 'cannot resolve the tagged commit' }
          git fetch origin main --no-tags
          if ($LASTEXITCODE -ne 0) { throw 'cannot fetch origin/main' }
          git merge-base --is-ancestor $head origin/main
          if ($LASTEXITCODE -ne 0) { throw "tag $env:TAG is not on main" }
          Add-Content -LiteralPath $env:GITHUB_OUTPUT -Value "version=$version"

      - name: Install the stable toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Cache cargo artifacts
        uses: Swatinem/rust-cache@v2

      - name: Set up MinGW for the Windows resource compiler
        id: mingw
        uses: egor-tensin/setup-mingw@v3
        with:
          platform: x64
          cc: 0

      - name: Confirm the resource compiler
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $windres = Get-Command windres -ErrorAction SilentlyContinue
          if ($null -eq $windres) {
              $prefixed = "${{ steps.mingw.outputs.windres }}"
              if (-not [string]::IsNullOrWhiteSpace($prefixed)) {
                  $windres = Get-Command "$prefixed.exe" -ErrorAction SilentlyContinue
              }
          }
          if ($null -eq $windres) {
              throw 'windres is required to embed the exe icon and version resource'
          }
          Add-Content -LiteralPath $env:GITHUB_PATH -Value (Split-Path -Parent $windres.Source)
          Add-Content -LiteralPath $env:GITHUB_ENV -Value "WINDRES=$($windres.Source)"
          & $windres.Source --version | Select-Object -First 1

      - name: Format, lint, and test
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          cargo fmt --all --check
          if ($LASTEXITCODE -ne 0) { throw 'cargo fmt failed' }
          cargo clippy --all-targets --locked -- -D warnings
          if ($LASTEXITCODE -ne 0) { throw 'cargo clippy failed' }
          cargo test --all-targets --locked
          if ($LASTEXITCODE -ne 0) { throw 'cargo test failed' }

      - name: Build the release executable
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          cargo build --release --locked
          if ($LASTEXITCODE -ne 0) { throw 'cargo build --release failed' }
          $version = "${{ steps.version.outputs.version }}"
          $info = (Get-Item -LiteralPath target/release/screencapture.exe).VersionInfo
          if ($info.FileVersion -ne $version) {
              throw "exe file version [$($info.FileVersion)] does not match $version"
          }
          # The exe is a GUI-subsystem program — no console window may flash
          # when the tray starts — and PowerShell hands the prompt back for one
          # of those rather than waiting, so the exit code comes from the
          # process object instead of $LASTEXITCODE.
          $said = Join-Path $env:RUNNER_TEMP 'version.txt'
          $launch = Start-Process -FilePath (Join-Path $PWD 'target/release/screencapture.exe') `
              -ArgumentList '--version' -RedirectStandardOutput $said -Wait -PassThru
          Get-Content -LiteralPath $said | Write-Host
          if ($launch.ExitCode -ne 0) {
              throw "release executable refused --version ($($launch.ExitCode))"
          }

      - name: Fetch the pinned FFmpeg engine
        shell: powershell
        run: ./scripts/fetch-ffmpeg.ps1

      - name: Record engine integrity
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $engine = 'vendor/ffmpeg/ffmpeg.exe'
          if (-not (Test-Path -LiteralPath $engine)) { throw 'the fetched engine is missing' }
          $hash = (Get-FileHash -LiteralPath $engine -Algorithm SHA256).Hash.ToLowerInvariant()
          Set-Content -LiteralPath 'vendor/ffmpeg/engine.sha256' -Value $hash
          Write-Host "engine sha256: $hash"

      - name: Install NSIS 3.13
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          choco install nsis --version=3.13.0 --no-progress -y --force
          if ($LASTEXITCODE -ne 0) { throw 'chocolatey could not install NSIS 3.13.0' }
          $makensis = Join-Path ${env:ProgramFiles(x86)} 'NSIS\makensis.exe'
          if (-not (Test-Path -LiteralPath $makensis)) { throw "makensis not found at $makensis" }
          $reported = (& $makensis /VERSION | Out-String).Trim()
          if ($LASTEXITCODE -ne 0) { throw 'makensis refused to run' }
          if ($reported -notmatch '^v3\.13(\.0)?$') {
              throw "expected NSIS 3.13, found [$reported]"
          }

      - name: Build the installer
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          New-Item -ItemType Directory -Path dist -Force | Out-Null
          Copy-Item -LiteralPath target/release/screencapture.exe -Destination dist/screencapture.exe -Force
          $makensis = Join-Path ${env:ProgramFiles(x86)} 'NSIS\makensis.exe'
          & $makensis "/DROOT=$($PWD.Path)" installer/nsis/screencapture.nsi
          if ($LASTEXITCODE -ne 0) { throw 'the installer build failed' }
          if (-not (Test-Path -LiteralPath installer/screencapture-setup.exe)) {
              throw 'the installer build produced no setup executable'
          }
          Copy-Item -LiteralPath installer/screencapture-setup.exe -Destination dist/screencapture-setup.exe -Force

      - name: Check the release versions
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $version = "${{ steps.version.outputs.version }}"
          foreach ($file in @('dist/screencapture.exe', 'dist/screencapture-setup.exe')) {
              $info = (Get-Item -LiteralPath $file).VersionInfo
              if ($info.ProductVersion -ne $version) {
                  throw "$file product version [$($info.ProductVersion)] does not match $version"
              }
          }

      - name: Write checksums
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $lines = foreach ($file in @('dist/screencapture.exe', 'dist/screencapture-setup.exe')) {
              $hash = (Get-FileHash -LiteralPath $file -Algorithm SHA256).Hash.ToLowerInvariant()
              "$hash  $(Split-Path -Leaf $file)"
          }
          # LF endings: sha256sum -c on other platforms reads the file verbatim.
          [System.IO.File]::WriteAllText(
              (Join-Path $PWD 'dist/SHA256SUMS.txt'),
              (($lines -join "`n") + "`n"),
              [System.Text.Encoding]::ASCII
          )
          Get-Content -LiteralPath dist/SHA256SUMS.txt

      - name: Keep the release artifacts
        uses: actions/upload-artifact@v7
        with:
          name: screencapture-release-${{ github.ref_name }}-${{ github.run_attempt }}
          path: dist
          if-no-files-found: error
          retention-days: 30

      - name: Publish the GitHub release
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
          REPO: ${{ github.repository }}
        run: |
          $ErrorActionPreference = 'Stop'
          $sums = "https://github.com/$env:REPO/releases/download/$env:TAG/SHA256SUMS.txt"
          $notes = @(
              'These Windows binaries are unsigned, so SmartScreen may ask for confirmation. The source is public: build the tag yourself and compare against the published checksums.'
              ''
              "Checksums: $sums"
          ) -join "`n"
          gh release create $env:TAG `
              dist/screencapture.exe `
              dist/screencapture-setup.exe `
              dist/SHA256SUMS.txt `
              --verify-tag `
              --latest `
              --title "screencapture $env:TAG" `
              --generate-notes `
              --notes $notes
          if ($LASTEXITCODE -ne 0) { throw 'gh release create failed' }
