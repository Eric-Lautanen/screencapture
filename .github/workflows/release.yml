name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  actions: read
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: build, sign, publish
    runs-on: windows-latest
    timeout-minutes: 120
    steps:
      - name: Check out the tagged tree
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Require a version tag on main
        id: version
        shell: pwsh
        env:
          TAG: ${{ github.ref_name }}
        run: |
          $ErrorActionPreference = 'Stop'
          $version = (Select-String -LiteralPath Cargo.toml -Pattern '^version = "(.+)"$').Matches[0].Groups[1].Value
          if ([string]::IsNullOrWhiteSpace($version)) { throw 'Cargo.toml has no package version' }
          if ($env:TAG -ne "v$version") {
              throw "tag $env:TAG does not match Cargo.toml version $version"
          }
          $head = (git rev-parse HEAD).Trim()
          if ($LASTEXITCODE -ne 0) { throw 'cannot resolve the tagged commit' }
          git fetch origin main --no-tags
          if ($LASTEXITCODE -ne 0) { throw 'cannot fetch origin/main' }
          git merge-base --is-ancestor $head origin/main
          if ($LASTEXITCODE -ne 0) { throw "tag $env:TAG is not on main" }
          Add-Content -LiteralPath $env:GITHUB_OUTPUT -Value "version=$version"

      - name: Require SignPath configuration
        shell: pwsh
        env:
          SIGNPATH_API_TOKEN: ${{ secrets.SIGNPATH_API_TOKEN }}
          SIGNPATH_ORGANIZATION_ID: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          SIGNPATH_PROJECT_SLUG: ${{ vars.SIGNPATH_PROJECT_SLUG }}
          SIGNPATH_SIGNING_POLICY_SLUG: ${{ vars.SIGNPATH_SIGNING_POLICY_SLUG }}
          SIGNPATH_APP_ARTIFACT_CONFIGURATION_SLUG: ${{ vars.SIGNPATH_APP_ARTIFACT_CONFIGURATION_SLUG }}
          SIGNPATH_INSTALLER_ARTIFACT_CONFIGURATION_SLUG: ${{ vars.SIGNPATH_INSTALLER_ARTIFACT_CONFIGURATION_SLUG }}
        run: |
          $ErrorActionPreference = 'Stop'
          $missing = @()
          if ([string]::IsNullOrWhiteSpace($env:SIGNPATH_API_TOKEN)) { $missing += 'SIGNPATH_API_TOKEN secret' }
          if ([string]::IsNullOrWhiteSpace($env:SIGNPATH_ORGANIZATION_ID)) { $missing += 'SIGNPATH_ORGANIZATION_ID variable' }
          if ([string]::IsNullOrWhiteSpace($env:SIGNPATH_PROJECT_SLUG)) { $missing += 'SIGNPATH_PROJECT_SLUG variable' }
          if ([string]::IsNullOrWhiteSpace($env:SIGNPATH_SIGNING_POLICY_SLUG)) { $missing += 'SIGNPATH_SIGNING_POLICY_SLUG variable' }
          if ([string]::IsNullOrWhiteSpace($env:SIGNPATH_APP_ARTIFACT_CONFIGURATION_SLUG)) { $missing += 'SIGNPATH_APP_ARTIFACT_CONFIGURATION_SLUG variable' }
          if ([string]::IsNullOrWhiteSpace($env:SIGNPATH_INSTALLER_ARTIFACT_CONFIGURATION_SLUG)) { $missing += 'SIGNPATH_INSTALLER_ARTIFACT_CONFIGURATION_SLUG variable' }
          if ($missing.Count -gt 0) {
              throw "SignPath is not configured; missing $($missing -join ', '). See docs/SIGNING.md."
          }

      - name: Install the stable toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Cache cargo artifacts
        uses: Swatinem/rust-cache@v2

      - name: Set up MinGW for the Windows resource compiler
        id: mingw
        uses: egor-tensin/setup-mingw@v3
        with:
          platform: x64
          cc: 0

      - name: Confirm the resource compiler
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $windres = Get-Command windres -ErrorAction SilentlyContinue
          if ($null -eq $windres) {
              $prefixed = "${{ steps.mingw.outputs.windres }}"
              if (-not [string]::IsNullOrWhiteSpace($prefixed)) {
                  $windres = Get-Command "$prefixed.exe" -ErrorAction SilentlyContinue
              }
          }
          if ($null -eq $windres) {
              throw 'windres is required to embed the exe icon and version resource'
          }
          Add-Content -LiteralPath $env:GITHUB_PATH -Value (Split-Path -Parent $windres.Source)
          Add-Content -LiteralPath $env:GITHUB_ENV -Value "WINDRES=$($windres.Source)"
          & $windres.Source --version | Select-Object -First 1

      - name: Format, lint, and test
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          cargo fmt --all --check
          if ($LASTEXITCODE -ne 0) { throw 'cargo fmt failed' }
          cargo clippy --all-targets --locked -- -D warnings
          if ($LASTEXITCODE -ne 0) { throw 'cargo clippy failed' }
          cargo test --all-targets --locked
          if ($LASTEXITCODE -ne 0) { throw 'cargo test failed' }

      - name: Build the release executable
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          cargo build --release --locked
          if ($LASTEXITCODE -ne 0) { throw 'cargo build --release failed' }
          $version = "${{ steps.version.outputs.version }}"
          $info = (Get-Item -LiteralPath target/release/screencapture.exe).VersionInfo
          if ($info.FileVersion -ne $version) {
              throw "exe file version [$($info.FileVersion)] does not match $version"
          }
          & ./target/release/screencapture.exe --version
          if ($LASTEXITCODE -ne 0) { throw 'release executable refused --version' }

      - name: Fetch the pinned FFmpeg engine
        shell: powershell
        run: ./scripts/fetch-ffmpeg.ps1

      - name: Record engine integrity
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $engine = 'vendor/ffmpeg/ffmpeg.exe'
          if (-not (Test-Path -LiteralPath $engine)) { throw 'the fetched engine is missing' }
          $hash = (Get-FileHash -LiteralPath $engine -Algorithm SHA256).Hash.ToLowerInvariant()
          Set-Content -LiteralPath 'vendor/ffmpeg/engine.sha256' -Value $hash
          Write-Host "engine sha256: $hash"

      - name: Install NSIS 3.13
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          choco install nsis --version=3.13.0 --no-progress -y --force
          if ($LASTEXITCODE -ne 0) { throw 'chocolatey could not install NSIS 3.13.0' }
          $makensis = Join-Path ${env:ProgramFiles(x86)} 'NSIS\makensis.exe'
          if (-not (Test-Path -LiteralPath $makensis)) { throw "makensis not found at $makensis" }
          $reported = (& $makensis /VERSION | Out-String).Trim()
          if ($LASTEXITCODE -ne 0) { throw 'makensis refused to run' }
          if ($reported -notmatch '^v3\.13(\.0)?$') {
              throw "expected NSIS 3.13, found [$reported]"
          }

      - name: Dry-run the installer build
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $makensis = Join-Path ${env:ProgramFiles(x86)} 'NSIS\makensis.exe'
          & $makensis "/DROOT=$($PWD.Path)" installer/nsis/screencapture.nsi
          if ($LASTEXITCODE -ne 0) { throw 'the unsigned dry-run installer build failed' }
          if (-not (Test-Path -LiteralPath installer/screencapture-setup.exe)) {
              throw 'the unsigned dry-run produced no setup executable'
          }
          Remove-Item -LiteralPath installer/screencapture-setup.exe -Force

      - name: Stage the unsigned application
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          New-Item -ItemType Directory -Path dist -Force | Out-Null
          Copy-Item -LiteralPath target/release/screencapture.exe -Destination dist/screencapture.exe -Force

      - name: Upload the unsigned application
        id: upload-app
        uses: actions/upload-artifact@v7
        with:
          name: screencapture-app-${{ github.run_id }}-${{ github.run_attempt }}
          path: dist/screencapture.exe
          if-no-files-found: error
          retention-days: 1

      - name: Sign the application
        uses: signpath/github-action-submit-signing-request@v3
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: ${{ vars.SIGNPATH_PROJECT_SLUG }}
          signing-policy-slug: ${{ vars.SIGNPATH_SIGNING_POLICY_SLUG }}
          artifact-configuration-slug: ${{ vars.SIGNPATH_APP_ARTIFACT_CONFIGURATION_SLUG }}
          github-artifact-id: ${{ steps.upload-app.outputs.artifact-id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          wait-for-completion: true
          wait-for-completion-timeout-in-seconds: 3600
          output-artifact-directory: target/signpath/signed-app
          parameters: |
            version: ${{ toJSON(steps.version.outputs.version) }}

      - name: Install and verify the signed application
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $signed = Get-ChildItem -LiteralPath target/signpath/signed-app -Filter screencapture.exe -File -Recurse |
              Select-Object -First 1
          if ($null -eq $signed) { throw 'SignPath returned no signed screencapture.exe' }
          Copy-Item -LiteralPath $signed.FullName -Destination target/release/screencapture.exe -Force
          Copy-Item -LiteralPath $signed.FullName -Destination dist/screencapture.exe -Force
          & ./scripts/verify-signature.ps1 -Path dist/screencapture.exe

      - name: Build the installer around the signed application
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $makensis = Join-Path ${env:ProgramFiles(x86)} 'NSIS\makensis.exe'
          & $makensis "/DROOT=$($PWD.Path)" installer/nsis/screencapture.nsi
          if ($LASTEXITCODE -ne 0) { throw 'the installer build failed' }
          if (-not (Test-Path -LiteralPath installer/screencapture-setup.exe)) {
              throw 'the installer build produced no setup executable'
          }
          Copy-Item -LiteralPath installer/screencapture-setup.exe -Destination dist/screencapture-setup.exe -Force

      - name: Upload the unsigned installer
        id: upload-installer
        uses: actions/upload-artifact@v7
        with:
          name: screencapture-installer-${{ github.run_id }}-${{ github.run_attempt }}
          path: dist/screencapture-setup.exe
          if-no-files-found: error
          retention-days: 1

      - name: Sign the installer
        uses: signpath/github-action-submit-signing-request@v3
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: ${{ vars.SIGNPATH_PROJECT_SLUG }}
          signing-policy-slug: ${{ vars.SIGNPATH_SIGNING_POLICY_SLUG }}
          artifact-configuration-slug: ${{ vars.SIGNPATH_INSTALLER_ARTIFACT_CONFIGURATION_SLUG }}
          github-artifact-id: ${{ steps.upload-installer.outputs.artifact-id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          wait-for-completion: true
          wait-for-completion-timeout-in-seconds: 3600
          output-artifact-directory: target/signpath/signed-installer
          parameters: |
            version: ${{ toJSON(steps.version.outputs.version) }}

      - name: Verify the signed installer and versions
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $signed = Get-ChildItem -LiteralPath target/signpath/signed-installer -Filter screencapture-setup.exe -File -Recurse |
              Select-Object -First 1
          if ($null -eq $signed) { throw 'SignPath returned no signed screencapture-setup.exe' }
          Copy-Item -LiteralPath $signed.FullName -Destination dist/screencapture-setup.exe -Force
          & ./scripts/verify-signature.ps1 -Path @(
              'dist/screencapture.exe'
              'dist/screencapture-setup.exe'
          )
          $version = "${{ steps.version.outputs.version }}"
          foreach ($file in @('dist/screencapture.exe', 'dist/screencapture-setup.exe')) {
              $info = (Get-Item -LiteralPath $file).VersionInfo
              if ($info.ProductVersion -ne $version) {
                  throw "$file product version [$($info.ProductVersion)] does not match $version"
              }
          }

      - name: Write checksums
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $lines = foreach ($file in @('dist/screencapture.exe', 'dist/screencapture-setup.exe')) {
              $hash = (Get-FileHash -LiteralPath $file -Algorithm SHA256).Hash.ToLowerInvariant()
              "$hash  $(Split-Path -Leaf $file)"
          }
          [System.IO.File]::WriteAllLines(
              (Join-Path $PWD 'dist/SHA256SUMS.txt'),
              $lines,
              [System.Text.Encoding]::ASCII
          )
          Get-Content -LiteralPath dist/SHA256SUMS.txt

      - name: Keep the signed artifacts
        uses: actions/upload-artifact@v7
        with:
          name: screencapture-signed-${{ github.ref_name }}-${{ github.run_attempt }}
          path: dist
          if-no-files-found: error
          retention-days: 30

      - name: Publish the GitHub release
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
          REPO: ${{ github.repository }}
        run: |
          $ErrorActionPreference = 'Stop'
          $policy = "https://github.com/$env:REPO/blob/$env:TAG/README.md#code-signing-policy"
          $notes = @(
              'Windows release binaries in this tag are Authenticode-signed with a certificate issued to SignPath Foundation.'
              ''
              '## Code signing policy'
              ''
              'Free code signing provided by SignPath.io, certificate by SignPath Foundation. Every signing request is manually approved before this release is published.'
              ''
              "[Read the full code signing policy]($policy)"
          ) -join "`n"
          gh release create $env:TAG `
              dist/screencapture.exe `
              dist/screencapture-setup.exe `
              dist/SHA256SUMS.txt `
              --verify-tag `
              --latest `
              --title "screencapture $env:TAG" `
              --generate-notes `
              --notes $notes
          if ($LASTEXITCODE -ne 0) { throw 'gh release create failed' }
