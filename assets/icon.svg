<?xml version="1.0" encoding="UTF-8"?>
<!--
  Screencapture tray icon source art (square master, 512).
  Convert to icon stack (.ico) at 16, 24, 32, 48, 64, 128, 256 px.
  The authored ico at assets/icon.ico stays the built resource until
  this replaces it.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Background: deep slate into a blue night tint -->
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#171d31"/>
      <stop offset="0.55" stop-color="#1d2846"/>
      <stop offset="1" stop-color="#33488f"/>
    </linearGradient>
    <!-- Recording-dot glow -->
    <radialGradient id="rec-glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#ff5252" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#ff5252" stop-opacity="0"/>
    </radialGradient>
    <!-- Screen: faint glass sheen -->
    <linearGradient id="screen" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2a3860"/>
      <stop offset="1" stop-color="#222c4d"/>
    </linearGradient>
  </defs>

  <rect x="16" y="16" width="480" height="480" rx="112" fill="url(#bg)"/>
  <rect x="16" y="16" width="480" height="480" rx="112" fill="none"
        stroke="#5b74c9" stroke-opacity="0.35" stroke-width="6"/>

  <!-- Monitor -->
  <rect x="92" y="118" width="328" height="232" rx="26" fill="url(#screen)"
        stroke="#e7ecfa" stroke-width="18"/>
  <!-- Stand -->
  <rect x="236" y="368" width="40" height="36" rx="8" fill="#e7ecfa"/>
  <rect x="176" y="404" width="160" height="20" rx="10" fill="#e7ecfa"/>

  <!-- Record dot -->
  <circle cx="256" cy="234" r="74" fill="url(#rec-glow)"/>
  <circle cx="256" cy="234" r="42" fill="#ff4d4f"/>
  <circle cx="243" cy="221" r="11" fill="#ff8c8e" opacity="0.85"/>
</svg>
