<?xml version="1.0" encoding="UTF-8"?>
<!--
  screencapture icon master, 512 x 512.

  Source art only: render the platform icons from this file rather than
  editing the PNG or ICO outputs. The mark is deliberately chunky so the
  screen outline and record dot survive a 16 px tray render.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#12182b"/>
      <stop offset="0.58" stop-color="#1d2a4f"/>
      <stop offset="1" stop-color="#3853a4"/>
    </linearGradient>
    <linearGradient id="screen" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2d3d69"/>
      <stop offset="1" stop-color="#1b2542"/>
    </linearGradient>
    <radialGradient id="rec-glow">
      <stop offset="0" stop-color="#ff4d4f" stop-opacity="0.42"/>
      <stop offset="1" stop-color="#ff4d4f" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Rounded slate tile, with the original soft blue rim. -->
  <rect x="16" y="16" width="480" height="480" rx="112" fill="url(#bg)"/>
  <rect x="16" y="16" width="480" height="480" rx="112" fill="none"
        stroke="#89a4ff" stroke-opacity="0.22" stroke-width="6"/>

  <!-- Monitor: a heavy outline keeps the silhouette legible at tray size. -->
  <rect x="76" y="116" width="360" height="248" rx="30"
        fill="url(#screen)" stroke="#f4f7ff" stroke-width="30"/>
  <rect x="238" y="356" width="36" height="46" rx="9" fill="#f4f7ff"/>
  <rect x="172" y="402" width="168" height="26" rx="13" fill="#f4f7ff"/>

  <!-- Record dot. -->
  <circle cx="256" cy="240" r="84" fill="url(#rec-glow)"/>
  <circle cx="256" cy="240" r="54" fill="#ff4d4f"/>
  <circle cx="239" cy="223" r="14" fill="#ffb3b4" opacity="0.75"/>
</svg>
